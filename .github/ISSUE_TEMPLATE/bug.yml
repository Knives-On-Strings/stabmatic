name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: shown in the plugin's About panel
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options:
        - VST3
        - CLAP
        - LV2
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: DAW and version
      placeholder: e.g. Reaper 7.x, Bitwig 5.x, Ableton 12
  - type: input
    id: synth
    attributes:
      label: Which synth is Stabmatic's MIDI going to?
      description: Stabmatic makes MIDI, not sound — most reports turn out to be about routing. Name the synth (or synth plugin) you routed Stabmatic's output to, and how (same track, a Patcher rack, MIDI From, etc.)
      placeholder: e.g. Serum on a separate track, via Ableton's MIDI From → Post FX
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we trigger this?
      value: |
        1.
        2.
        3.

